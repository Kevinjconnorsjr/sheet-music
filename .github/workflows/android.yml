name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish releases from main
    env:
      # Each build gets a higher version number, so new APKs install as updates.
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEY" | base64 -d > "$RUNNER_TEMP/scorestand.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/scorestand.jks" >> "$GITHUB_ENV"

      - name: Warn when the signing key is missing
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set — APKs use a throw-away key and no release is published."

      - name: Test, lint and build APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Name the APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ScoreStand-0.1.${BUILD_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ScoreStand-0.1.${BUILD_NUMBER}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ScoreStand-apk
          path: dist/*.apk

      # Every change that lands on main becomes a downloadable release.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: ScoreStand 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Install:** download `ScoreStand-0.1.${{ github.run_number }}.apk` below and open it on your phone.
            It installs over any earlier version and keeps your library.

            `-debug.apk` is a slower diagnostic build — only needed if the main APK misbehaves.

            Changes: ${{ github.event.head_commit.message }}
          files: dist/*.apk
